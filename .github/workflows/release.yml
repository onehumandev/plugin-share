name: "Publish Plugin Packages"

# This workflow is triggered when a semver tag is pushed, including prerelease tags like v1.0.0-rc.
on:
  push:
    tags:
      - "v*.*.*"
  # Allows a missed or suppressed tag event to be recovered without rewriting
  # an already-published release tag. Run this workflow against the tag ref.
  workflow_dispatch:
    inputs:
      skip-crate:
        description: "Skip the crates.io publish (for re-running the npm publish after the crate is already out)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package versions
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow against a release tag, not $GITHUB_REF."
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          npm_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$cargo_version" ] || [ "$tag_version" != "$npm_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) and package.json ($npm_version)."
            exit 1
          fi
          # Prereleases go to the `next` dist-tag so `npm install` keeps resolving to a stable release.
          if [[ "$tag_version" == *-* ]]; then
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libxdo-dev libayatana-appindicator3-dev
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --all-targets
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and test the JavaScript package
        run: |
          bun run build
          git diff --exit-code -- api-iife.js
          bun run test
          bun run test:types

  publish-crate-dry-run:
    needs: verify
    if: ${{ !inputs.skip-crate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libxdo-dev libayatana-appindicator3-dev
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run cargo publish dry-run
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          dry-run: true

  publish-npm-dry-run:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the plugin
        run: bun run build
      - name: Pack the npm package
        run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - name: Run npm publish dry-run
        run: npm publish ./artifacts/*.tgz --access public --dry-run --tag "${{ needs.verify.outputs.npm-tag }}"

  publish-crate:
    needs: [publish-crate-dry-run, publish-npm-dry-run]
    if: ${{ !inputs.skip-crate }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-4.1 libxdo-dev libayatana-appindicator3-dev
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Runs after the crate so a failed crate publish never leaves an npm release
  # without its matching Rust crate. Publishes through npm trusted publishing
  # (OIDC), so no npm token is stored in the repository: the package's trusted
  # publisher on npmjs.com must name this repository, this workflow file and
  # the `npm` environment.
  publish-npm:
    needs: [verify, publish-crate]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11.6.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the plugin
        run: bun run build
      - name: Pack the npm package
        run: mkdir -p artifacts && npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
      - name: Publish to npm
        run: npm publish ./artifacts/*.tgz --access public --provenance --tag "${{ needs.verify.outputs.npm-tag }}"
